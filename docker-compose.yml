services:
  app:
    build: .
    restart: always
    volumes:
      - ./scribbles:/app/scribbles
    networks:
      - portfolio-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80" # Maps laptop Port 80 straight to Nginx container Port 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge
