<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yubi's Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="terminal-container">
        <nav class="terminald-tabs">
            <a href="/" class="tab {% if active_tab == 'welcome' %}active{% endif %}">~/welcome</a>
            <a href="/projects" class="tab {% if active_tab == 'projects' %}active{% endif %}">~/projects</a>
            <a href="/scribble" class="tab {% if active_tab == 'my-scribbles' %}active{% endif %}">~/my-scribbles</a>
            <a href="/contact" class="tab {% if active_tab == 'contact-me' %}active{% endif %}">~/contact-me</a>
        </nav>

        <div class="terminal-body">
            <div class="command-line">
                <span class="prompt">Yubi@home-server:~$</span>
                <span class="command">cat {{ active_tab }}.md</span>
            </div>

            <div class="content-area">
                {% block content %}{% endblock %}
            </div>

            <div class="command-line">
                <br>
                <span class="prompt">Yubi@home-server:~$</span><span class="cursor">█</span>
            </div>
        </div>
    </div>

    <script>
        function typeEffect(element, text, speed) {
            let i = 0;
            element.innerHTML = ""; 
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        async function startTyping() {
            const allTypeText = document.querySelectorAll('#typewriter-text1, #typewriter-text2');
            for (const element of allTypeText) {
                if (element) {
                    const text = element.innerText;
                    typeEffect(element, text, 40);
                    await sleep(2000); 
                }
            }
        }
        window.addEventListener('DOMContentLoaded', startTyping);
    </script>
</body>
</html>
